appId: com.ascend.interviewcoach
productName: Ascend
copyright: Copyright © 2026 Appani Kaushik
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - resources/**
  - package.json
  - "!**/*.map"
# The Claude Code native binary is spawned as a child process, so it must live outside the asar archive.
asarUnpack:
  - "**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
npmRebuild: false
# Local Windows builds reuse the Electron copy npm installed (see the dist scripts in package.json):
# it avoids re-downloading and an antivirus-induced EPERM when electron-builder renames its fresh copy.
# CI runners don't have that copy, so electron-builder downloads Electron there as usual.
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ascend
  # Version-free names keep the website's "latest release" download links stable.
  artifactName: Ascend-Windows-Setup.${ext}
mac:
  icon: build/icon.png
  category: public.app-category.education
  target:
    - target: dmg
  # No Apple Developer ID yet: ad-hoc signing lets it run on Apple Silicon; Gatekeeper asks once on first launch.
  identity: "-"
  hardenedRuntime: false
dmg:
  artifactName: Ascend-macOS-${arch}.${ext}
